- id: bounded-autonomy
  title: "Bounded Autonomy: Controlling LLM Characters in Live Multiplayer Games"
  role: "First author"
  venue: "arXiv:2604.04703 [cs.HC]"
  year: 2026
  status: "preprint"
  url: "https://arxiv.org/abs/2604.04703"
  summary: >
    How should LLM characters take part in live multiplayer play while staying executable in
    the shared world, coherent with the other characters, and steerable by players? The paper
    organises character control around three interfaces: agent-to-agent communication kept
    stable with probabilistic reply-chain decay, world actions grounded through embeddings with
    fallbacks, and a whisper that lets players nudge a character without taking it over.
    Deployed in Bside: Desktop Mate; a formative analysis of the live game shows the architecture
    keeping interaction stable and player interventions landing.

- id: dobit-to-bside
  title: "Dobit to Bside: Grounding LLM Characters into Executable Gameplay"
  role: "First author"
  venue: "AIIDE 2026, Case Studies track"
  year: 2026
  status: "accepted, to appear"
  url: ""
  summary: >
    A case study of three products: Bside on mobile, a character-raising game built around
    AI-native play; Bside: Desktop Mate, where every character is player-owned and run by a
    bounded multi-agent runtime; and Dobit before them, a multiplayer life simulation with an
    open-ended multi-agent town.
    What it took to turn open-ended model output into actions a game can execute, and how each
    step tracked what language models had become capable of and affordable enough to do.
    Presentation scheduled for November 2026; the paper will be linked once published.

- id: raise-dont-replace
  title: "Raise, Don't Replace: Two Kinds of Connection in AI Character Products"
  role: "Second author"
  venue: "BritCHI 2026 (39th International BCS Human-Computer Interaction Conference), Short Papers track"
  year: 2026
  status: "accepted, to appear"
  url: ""
  summary: >
    A short paper that separates two kinds of connection an AI character product can support,
    connection with the character and connection between people that the character brings
    about, and argues for designs that raise human relationships rather than replace them.
    Brunel University of London, 1 to 3 November 2026.

- id: myself-my-child-my-friend
  title: "Myself, My Child or My Friend: Understanding Player Relationships with AI-Generated Game Characters"
  role: "Fourth author"
  venue: "CHI EA '25 (Extended Abstracts of the CHI Conference on Human Factors in Computing Systems)"
  year: 2025
  status: "published"
  url: "https://doi.org/10.1145/3706599.3720207"
  summary: >
    How do players see the AI characters they play with: as themselves, as a child to raise,
    or as a friend? A two-week study of 120 players on a custom AI-integrated game platform,
    combining questionnaires, periodic relationship ratings and interaction logs. Personality
    tracked the relationship people chose: introverted players leaned towards nurturing and
    watching a character grow, extroverted players towards companionship, and younger players
    towards self-projection and a stronger wish for control.
